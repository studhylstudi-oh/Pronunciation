<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Final Sounds · Studhyls Learning Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,500;1,700&family=Quicksand:wght@500;600;700&family=Great+Vibes&family=Amiri:wght@700&display=swap" rel="stylesheet">
<style>
:root{--pink:#FFD3E4;--rose:#E985AE;--plum:#6B3F63;--cream:#FFF8EC;--butter:#FFF1B8;--sky:#CDE5FB;--lilac:#DDD0F6;--ink:#5A3556;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;font-family:Quicksand,system-ui,sans-serif;font-weight:600;color:var(--ink);line-height:1.6;background:repeating-linear-gradient(90deg,var(--pink) 0 56px,var(--cream) 56px 112px)}
h1,h2,h3{font-family:'Playfair Display',Georgia,serif;font-style:italic;color:var(--plum);margin:.2em 0;line-height:1.2}
h2{font-size:clamp(1.6rem,5vw,2.1rem)}h3{font-size:1.25rem}
p{margin:.5em 0}
.wrap{max-width:780px;margin:0 auto;padding:18px 14px 40px}
.top{display:flex;align-items:center;gap:10px;justify-content:space-between;margin-bottom:12px;background:var(--cream);border:2px solid var(--plum);border-radius:999px;padding:8px 16px}
.top b{font-family:'Playfair Display',serif;font-style:italic;font-size:.95rem}
.dots{display:flex;gap:6px}.dots i{width:12px;height:12px;border-radius:50%;background:var(--pink);border:1.5px solid var(--plum)}.dots i.on{background:var(--rose)}.dots i.done{background:var(--butter)}
.card{background:var(--cream);border:2px solid var(--plum);border-radius:30px;padding:clamp(18px,4vw,34px);box-shadow:6px 6px 0 var(--lilac)}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
button{font:inherit;font-weight:700;cursor:pointer;border:2px solid var(--plum);color:var(--plum);background:var(--butter);border-radius:999px;padding:8px 18px;transition:transform .15s,background .15s}
button:hover{transform:translateY(-2px)}button:focus-visible{outline:3px solid var(--rose);outline-offset:2px}
button.go{background:var(--rose);color:#fff}button.ghost{background:var(--cream)}
button:disabled{opacity:.4;cursor:default}
.uk,.us{padding:4px 12px;font-size:.85rem}.uk{background:var(--sky)}.us{background:var(--pink)}
.pl{display:inline-flex;gap:6px;align-items:center;flex-wrap:wrap}
.chip{display:inline-block;border:2px solid var(--plum);border-radius:16px;padding:2px 12px;background:var(--butter)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));margin:14px 0}
.box{border:2px solid var(--plum);border-radius:22px;padding:14px 16px}
.y{background:var(--butter)}.b{background:var(--sky)}.l{background:var(--lilac)}.p{background:var(--pink)}
.tip{background:var(--lilac);border-left:8px solid var(--rose);border-radius:16px;padding:10px 16px;margin:14px 0}
.ar{font-family:Amiri,serif;font-size:2.4rem;line-height:1.1;direction:rtl}
/* cover */
.cover{text-align:center}
.cover img.logo{width:min(380px,82%);display:block;margin:0 auto;filter:drop-shadow(0 4px 8px rgba(233,133,174,.35))}
.cover h1{font-size:clamp(2.1rem,8vw,3.2rem);margin:.1em 0}
.by{font-family:'Great Vibes',cursive;font-size:2.1rem;color:var(--rose);margin-top:18px}
.badge{display:inline-block;margin:8px 4px;background:var(--sky);border:2px solid var(--plum);border-radius:999px;padding:2px 14px;font-size:.9rem}
/* tutor */
.tutor{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.tutor img{width:150px;height:190px;object-fit:cover;object-position:50% 20%;border-radius:70px 70px 24px 24px;border:3px solid var(--plum);box-shadow:5px 5px 0 var(--pink)}
.tutor div{flex:1;min-width:220px}
/* qolqolah */
.qq{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:14px 0}
.qq button{width:76px;height:86px;border-radius:26px;background:var(--butter);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0}
.qq button small{font-size:.8rem}
.qq button.bounce .ar{animation:bn .6s}
@keyframes bn{0%{transform:translateY(0)}30%{transform:translateY(-16px) scale(1.15)}60%{transform:translateY(2px)}100%{transform:none}}
.wave{height:70px;display:flex;align-items:flex-end;justify-content:center;gap:5px;margin:8px 0}
.wave i{width:12px;border-radius:8px 8px 3px 3px;background:var(--rose)}
/* tabs */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.tabs button.on{background:var(--rose);color:#fff}
table{width:100%;border-collapse:separate;border-spacing:0 8px}td{padding:8px 12px;background:var(--cream);border-top:2px solid var(--plum);border-bottom:2px solid var(--plum)}td:first-child{border-left:2px solid var(--plum);border-radius:16px 0 0 16px}td:last-child{border-right:2px solid var(--plum);border-radius:0 16px 16px 0}
/* vowel bars */
.vb{display:flex;align-items:center;gap:10px;margin:10px 0}.vb span.w{width:62px}
.bar{height:26px;border-radius:14px;border:2px solid var(--plum);background:var(--sky);width:0;transition:width .8s}
.bar.long{background:var(--lilac)}
.end{display:inline-block;width:26px;height:26px;border-radius:50%;border:2px solid var(--plum);background:var(--butter);text-align:center;line-height:22px;font-size:.8rem}
.say{font-size:1.5rem}.no{color:#B34A6C;text-decoration:line-through}.ok{color:#3E7A5B}
/* quiz */
.opts{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:14px 0}.opts button{font-size:1.3rem;padding:10px 28px}
.opts button.good{background:#CDEFD8}.opts button.bad{background:#F8C9D6}
.stars{font-size:2rem;letter-spacing:4px}
.fb{min-height:3em}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>

let voices=[];speechSynthesis.onvoiceschanged=()=>voices=speechSynthesis.getVoices();
function say(t,l,slow){if(!('speechSynthesis' in window))return;speechSynthesis.cancel();voices=speechSynthesis.getVoices();const u=new SpeechSynthesisUtterance(t);u.lang=l;const v=voices.find(v=>v.lang.replace('_','-')===l);if(v)u.voice=v;u.rate=slow?.6:.9;speechSynthesis.speak(u)}
const pl=(w,t)=>`<span class="pl"><button class="uk" onclick="say('${t||w}','en-GB')" aria-label="British ${w}">🇬🇧 UK</button><button class="us" onclick="say('${t||w}','en-US')" aria-label="American ${w}">🇺🇸 US</button></span>`;

S[0]=()=>`<div class="tutor"><img src="${PROF}" alt="Professa Fadhila Afiya"><div><h2>Hello, beautiful learner 🎀</h2><p>I am <b>Professa Fadhila Afiya</b>, your private English tutor. Today we polish one tiny detail that makes your English sound smooth and confident: <b>the last sound of a word</b>.</p></div></div>
<div class="grid"><div class="box y"><h3>Today's sounds</h3><p><span class="chip">/p/</span> <span class="chip">/b/</span> <span class="chip">/t/</span> <span class="chip">/d/</span> <span class="chip">/k/</span> <span class="chip">/g/</span> <span class="chip">/tʃ/</span> <span class="chip">/dʒ/</span></p><p>These are called <b>stop sounds</b>: your air is blocked, then freed.</p></div>
<div class="box b"><h3>Your 3 goals</h3><p>1. Keep the final sound, don't drop it.<br>2. Don't add an extra "uh".<br>3. Show voiced vs. voiceless with the vowel.</p></div></div>
<div class="tip">💡 <b>Spelling alert:</b> the letter <b>c</b> at the end usually says /k/ (<i>music, topic, magic</i>). The letters <b>ch / tch</b> say /tʃ/ (<i>rich, match</i>), and <b>j / ge / dge</b> say /dʒ/ (<i>page, bridge</i>).</p></div>
<p>Tap UK or US anywhere to hear a British or American voice. 🎧 <small>(Sound uses your device's voices.)</small></p>`;
S[1]=()=>`<h2>Your secret key: qolqolah ✨</h2>
<p>You already know a final-stop skill from reciting the Qur'an. In <b>qolqolah</b>, five letters make an echo when they carry sukun: <b>ق ط ب ج د</b> (<i>qutbu jadin</i>). Tap them to feel the bounce.</p>
<div class="qq" id="qq">${['ق|q','ط|ṭ','ب|b','ج|j','د|d'].map(x=>{let[a,b]=x.split('|');return `<button onclick="bounce(this)"><span class="ar">${a}ْ</span><small>${b}</small></button>`}).join('')}</div>
<div class="wave" id="wv"></div>
<div class="grid"><div class="box l"><h3>What is the same</h3><p>The sound closes, then releases. Our English <b>/k/ /t/ /d/ /b/ /dʒ/</b> are close cousins of ق ط د ب ج.</p></div>
<div class="box p"><h3>What is different</h3><p>Qolqolah kubra at the end of a word is a clear echo. English is <b>lighter</b>: a tiny puff of air, never a vowel. Think <b>"qolqolah-lite"</b>.</p></div></div>
<div class="tip">🌸 Arabic ق is deeper in the throat than English /k/, and ط is heavier than English /t/. English is softer and more forward.</div>`;
const G={
'p · b':{c:'y',a:'ب',where:'Both lips',w:[['cap','cab'],['stop','Bob'],['rope','robe']],ar:'ب (ba) is the voiced one'},
't · d':{c:'b',a:'ط / د',where:'Tongue tip on the ridge behind your top teeth',w:[['bat','bad'],['write','ride'],['seat','seed']],ar:'د (dal) is close to /d/; ط is heavier'},
'k · g':{c:'l',a:'ق',where:'Back of the tongue touches the soft roof',w:[['back','bag'],['pick','pig'],['music','dig']],ar:'ق is deeper than English /k/'},
'ch · j':{c:'p',a:'ج',where:'Flat tongue blade, then a soft "sh/zh" release',w:[['rich','ridge'],['match','Madge'],['batch','badge']],ar:'ج (jim) is the sister of /dʒ/'}};
S[2]=()=>`<h2>The sound map 🗺️</h2><p>Pick a pair. Each has a <b>voiceless</b> sound (no vibration) and a <b>voiced</b> sound (throat vibrates, hand on throat!).</p><div class="tabs" id="tb">${Object.keys(G).map((k,i)=>`<button class="${i?'':'on'}" onclick="tab('${k}',this)">${k}</button>`).join('')}</div><div id="gp"></div>`;
function tab(k,b){document.querySelectorAll('#tb button').forEach(x=>x.classList.remove('on'));b.classList.add('on');const g=G[k];
$('#gp').innerHTML=`<div class="box ${g.c}"><p><b>Where?</b> ${g.where}.</p><p><b>Arabic link:</b> <span class="ar" style="font-size:1.6rem">${g.a}</span> · ${g.ar}</p></div><table>${g.w.map(p=>`<tr><td>${p[0]} <small>(voiceless)</small><br>${pl(p[0])}</td><td>${p[1]} <small>(voiced)</small><br>${pl(p[1])}</td></tr>`).join('')}</table>
<div class="tip">Accent note: both UK and US speakers often <b>hold</b> a final /t/ or /k/ without a loud puff. Many British voices give a slightly crisper small release; many American voices hold it more. Both are natural, so choose one and stay calm and clean.</div>`}
S[3]=()=>`<h2>Voiced or voiceless? Listen to the vowel 👂</h2>
<p>At the end of a word, English /b d g dʒ/ can be weak, so we do not rely on the last sound alone. The secret is the <b>vowel before it</b>: it is <b>longer</b> before a voiced sound and <b>shorter</b> before a voiceless one.</p>
<div id="vb"></div>
<div class="tip">🎀 Qolqolah link: just as tajweed tells you how to shape a letter, here the vowel tells your listener which ending you meant. Say <b>baaad</b> (long) and <b>bat</b> (short, crisp).</div>
<p>Practice: say each pair, stretching the vowel only in the voiced word.</p>`;
const VP=[['bat','bad'],['back','bag'],['rice','rise'],['cap','cab']];
function vb(){$('#vb').innerHTML=VP.map(p=>`<div class="vb"><span class="w">${p[0]}</span><div class="bar" data-w="38%"></div>${pl(p[0])}</div><div class="vb"><span class="w">${p[1]}</span><div class="bar long" data-w="76%"></div>${pl(p[1])}</div>`).join('');setTimeout(()=>document.querySelectorAll('.bar').forEach(b=>b.style.width=b.dataset.w),80)}
S[4]=()=>`<h2>Close it, don't "uh" it 🚫</h2>
<p>The most common mistake is adding a little vowel after the last sound. Remember: Arabic qolqolah echoes, but English only <b>closes</b>.</p>
<div class="grid">${[['bag','bag-uh'],['cat','cat-uh'],['back','back-ah'],['bed','bed-uh']].map(x=>`<div class="box y"><div class="say"><span class="ok">✓ ${x[0]}</span><br><span class="no">✗ ${x[1]}</span></div>${pl(x[0])}</div>`).join('')}</div>
<h3>Three-move recipe</h3><div class="tabs" id="mv"><button onclick="mv(this,'Close: lips, tongue tip or back of tongue touches. The word stops.')">1 Close</button><button onclick="mv(this,'Hold: the air waits for a blink. No voice, no vowel.')">2 Hold</button><button onclick="mv(this,'Tiny puff: a whisper of air, only if you want it. Never \\'uh\\'.')">3 Tiny puff</button></div><div class="tip" id="mvt">Tap a move 👆</div>
<h3>Sentences to glide through</h3>${['Pick a big black bag.','The cat sat on the red bed.','A rich bridge at the edge of the village.'].map(s=>`<div class="box b" style="margin:8px 0">${s}<br>${pl(s)}</div>`).join('')}`;
function mv(b,t){document.querySelectorAll('#mv button').forEach(x=>x.classList.remove('on'));b.classList.add('on');$('#mvt').textContent=t}
const Q=[['bat','bad'],['cap','cab'],['back','bag'],['rich','ridge'],['write','ride'],['peck','peg']];
let order=[];
S[5]=()=>{if(qi>=Q.length)return `<h2>Practice complete 🎉</h2><p>You scored <b>${score}/${Q.length}</b>.</p><div class="stars">${'⭐'.repeat(Math.max(1,Math.round(score/Q.length*5)))}</div><div class="tip">Next, say the pairs aloud with a clean ending. Listen, repeat, and match the vowel length.</div><button class="ghost" onclick="qi=0;score=0;render()">Try again</button>`;
const p=Q[qi],pick=Math.random()<.5?0:1,acc=Math.random()<.5?'en-GB':'en-US';order=[p,pick,acc];window.__q=order;
return `<h2>Listen &amp; choose 🎧</h2><p>Question ${qi+1} of ${Q.length}. Which word do you hear?</p><div style="text-align:center"><button class="go" onclick="say('${p[pick]}','${acc}')">▶ Play (${acc==='en-GB'?'🇬🇧 UK':'🇺🇸 US'})</button></div><div class="opts">${p.map((w,i)=>`<button onclick="ans(${i},this)">${w}</button>`).join('')}</div><p class="fb" id="fb" style="text-align:center">Clue: the voiced word has the longer vowel.</p>`}
function ans(i,b){if(answered)return;answered=true;const[p,pick]=window.__q;const ok=i===pick;if(ok)score++;b.classList.add(ok?'good':'bad');document.querySelectorAll('.opts button')[pick].classList.add('good');$('#fb').innerHTML=(ok?'💖 Lovely! ':'🌷 Almost! ')+`It was <b>${p[pick]}</b>. `+'<button onclick="qi++;answered=false;render()">Next</button>'}
S[6]=()=>`<div style="text-align:center"><h2>You did it, gorgeous 🎀</h2><p>Remember the 4 jewels:</p></div><div class="grid"><div class="box y">🔒 Close the final sound</div><div class="box b">🚫 No extra "uh"</div><div class="box l">👂 Vowel long = voiced</div><div class="box p">✨ Qolqolah-lite: tiny, clean</div></div><div class="tutor"><img src="${PROF}" alt="Professa Fadhila Afiya"><div><p>Read aloud for 5 minutes each day and record yourself. Your pronunciation grows like a flower, one sound at a time.</p><div class="by" style="margin:0">Professa Fadhila Afiya</div><p><small>Built and developed by Studhyls Learning Studio</small></p></div></div>`;
function bounce(b){b.classList.remove('bounce');void b.offsetWidth;b.classList.add('bounce');const w=$('#wv');w.innerHTML=[30,60,28,12,6].map(h=>`<i style="height:${h}px"></i>`).join('');}
function cover(){$('#app').innerHTML=`<div class="card cover"><img class="logo" src="${LOGO}" alt="Studhyls Learning Studio logo"><h1>Final Sounds</h1><p>/k/ /t/ /d/ /dʒ/ at the end of words, with a qolqolah bridge</p><span class="badge">🇬🇧 British</span><span class="badge">🇺🇸 American</span><span class="badge">🕌 Arabic link</span><br><br><button class="go" onclick="step=0;render()">Start the lesson 🎀</button><div class="by">by Professa Fadhila Afiya</div></div>`}
function render(){const a=$('#app');a.innerHTML=`<div class="top"><b>Studhyls · ${names[step]}</b><div class="dots">${names.map((n,i)=>`<i class="${i<step?'done':i==step?'on':''}"></i>`).join('')}</div></div><div class="card">${S[step]()}</div><div class="nav"><button class="ghost" onclick="${step?'step--;render()':'cover()'}">← Back</button><button class="go" ${step==S.length-1?'onclick="cover()">Cover':'onclick="step++;answered=false;render()">Next'}</button></div>`;
if(step==2)tab('p · b',document.querySelector('#tb button'));if(step==3)vb();scrollTo(0,0)}
cover();
</script></body></html>
